name: 发布桌面应用

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 确认发布标签来自 main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 核对桌面标签、源码版本和发布说明
        run: node -e 'const fs=require("node:fs"); const p=require("./packages/desktop-app/package.json"); if (process.env.GITHUB_REF_NAME !== `desktop-v${p.version}`) process.exit(1); if (p.build?.buildVersion !== p.version) { console.error("build.buildVersion 与 version 不一致"); process.exit(1); } if (!fs.existsSync(`packages/desktop-app/RELEASE-${p.version}.md`)) { console.error(`缺少 packages/desktop-app/RELEASE-${p.version}.md`); process.exit(1); }'
      - run: npm run check
      - run: npm run typecheck --workspace zhishu-desktop

  macos:
    needs: verify
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run pack:mac --workspace zhishu-desktop
      - name: 核对手动安装包
        run: node packages/desktop-app/scripts/verify-update-assets.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: manual-macos
          path: |
            packages/desktop-app/release/*.dmg
          if-no-files-found: error

  windows:
    needs: verify
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run pack:win --workspace zhishu-desktop
      - name: 核对手动安装包
        run: node packages/desktop-app/scripts/verify-update-assets.mjs --manual
      - uses: actions/upload-artifact@v4
        with:
          name: manual-windows
          path: |
            packages/desktop-app/release/*.exe
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: 发布独立的桌面应用 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          notes="packages/desktop-app/RELEASE-${version}.md"
          test -f "$notes"
          test -f "release-assets/ZhiShu-Desktop-${version}-macOS-arm64.dmg"
          test -f "release-assets/ZhiShu-Desktop-${version}-Windows-x64.exe"
          test ! -f release-assets/latest.yml
          (cd release-assets && sha256sum "ZhiShu-Desktop-${version}-macOS-arm64.dmg" "ZhiShu-Desktop-${version}-Windows-x64.exe" > SHA256SUMS.txt)
          test -s release-assets/SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --latest=false --title "智枢 $version" --notes-file "$notes"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
